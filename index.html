    <title>影像醫學部排班系統</title>
    <!-- Version: 2026-01-14 Force Update -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      const appendDiagnostic = (title, detail, position) => {
        const panel = document.createElement("div");
        panel.style.cssText = `position:fixed;${position}:0;left:0;width:100%;padding:20px;background:#991b1b;color:white;z-index:99999;font-family:monospace;white-space:pre-wrap;`;

        const heading = document.createElement("strong");
        heading.textContent = title;
        panel.appendChild(heading);
        panel.appendChild(document.createElement("br"));
        panel.appendChild(document.createTextNode(detail));
        document.body.appendChild(panel);
      };

      const canShowDiagnostics = ["localhost", "127.0.0.1"].includes(window.location.hostname);

      window.onerror = function(message, source, lineno, colno, error) {
        const detail = canShowDiagnostics
          ? `${String(message)}\nSource: ${String(source)}:${lineno}:${colno}\nStack: ${error?.stack || "N/A"}`
          : "系統載入失敗，請重新整理頁面；若問題持續發生，請聯絡系統管理員。";
        appendDiagnostic("CRITICAL ERROR (OnLoad):", detail, "top");
        return false;
      };

      window.onunhandledrejection = function(event) {
        const detail = canShowDiagnostics
          ? String(event.reason?.stack || event.reason || "Unknown rejection")
          : "系統發生未預期錯誤，請稍後重試。";
        appendDiagnostic("UNHANDLED PROMISE:", detail, "bottom");
      };
    </script>
