    <script>
      // Global Error Handler to catch "White Screen" issues before React loads
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += `
          <div style="position:fixed; top:0; left:0; width:100%; padding:20px; background:red; color:white; z-index:99999; font-family:monospace; white-space:pre-wrap;">
            <strong>CRITICAL ERROR (OnLoad):</strong><br>
            ${message}<br>
            Source: ${source}:${lineno}:${colno}<br>
            Stack: ${error ? error.stack : 'N/A'}
          </div>
        `;
        return false; 
      };
      
      window.onunhandledrejection = function(event) {
        document.body.innerHTML += `
          <div style="position:fixed; bottom:0; left:0; width:100%; padding:20px; background:darkred; color:white; z-index:99999; font-family:monospace; white-space:pre-wrap;">
             <strong>UNHANDLED PROMISE:</strong><br>
             ${event.reason}
          </div>
        `;
      };
    </script>

      ::-webkit-scrollbar-thumb {
