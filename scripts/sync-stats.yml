name: 每日自動同步資料 (Salesforce to Supabase)

on:
  schedule:
    # 每天台灣時間 14:00 執行 (UTC 時間 06:00)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      blocks:
        description: "同步區塊 (例如 1,3)"
        required: false
        default: "1,3"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # 配合你的 Node.js 版本

      - name: 安裝依賴套件
        run: npm ci

      - name: 執行同步腳本
        env:
          # 請務必在 GitHub 專案的 Settings -> Secrets and variables -> Actions 中設定這些變數！
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_LOGIN_BASE_URL: ${{ secrets.SALESFORCE_LOGIN_BASE_URL }}
          # 預設執行區塊 (若為手動觸發則帶入使用者輸入)
          SYNC_BLOCKS: ${{ github.event.inputs.blocks || '1,3' }}
        run: npm run sync-stats
