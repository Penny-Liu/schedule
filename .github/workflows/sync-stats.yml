name: 每日自動同步資料 (Salesforce to Supabase)

on:
  schedule:
    # 每天台灣時間 14:00 執行 (UTC 時間 06:00)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sync_payload:
        description: "JSON payload for custom sync"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴套件
        run: npm ci

      - name: 執行同步腳本
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_LOGIN_BASE_URL: ${{ secrets.SALESFORCE_LOGIN_BASE_URL }}
          SYNC_PAYLOAD: ${{ github.event.inputs.sync_payload || '[{"id":1,"selected":true},{"id":3,"selected":true}]' }}
        run: npm run sync-stats
